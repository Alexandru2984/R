# Include once in Nginx's http context.
map $http_origin $rtraffic_origin_allowed {
    default 0;
    '' 1;
    'https://r.micutu.com' 1;
}

map $uri $rtraffic_private_cache {
    default '';
    ~^/session/ 'private, no-store';
}
map $uri $rtraffic_private_robots {
    default '';
    ~^/session/ 'noindex, nofollow, noarchive';
}
